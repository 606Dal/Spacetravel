<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{tpl/tpl_fragments :: tpl_head( title='정보페이지' )}" />

<body>
	<nav th:replace="~{tpl/tpl_fragments :: tpl_nav ( 'infoview' ) }" />

	<header th:replace="~{tpl/tpl_fragments :: tpl_header ( htitle = '오늘의 천문학 사진', hcontent = ' ')}" />


	<div class="row">
		<nav th:replace="~{tpl/tpl_fragments :: tpl_informationSideNav ( 'pictureOfTheDay' ) }" />

		<!-- Main Content-->
		<main class="container col-sm-9 mb-4 jua-font">
			<div class="px-lg-5" th:object="${apodDTO}">
				<div class="justify-content-center">
					<div id="content" class="p-3">
						<div class="text-center py-2">
							<!--/* 타입이 video가 아닐 경우 */-->
							<th:block th:if="${apodDTO.apodMedia_type == 'image'}">
								<form th:action="@{/infoview/nasaApodFullimage}" method="post" target="_blank">
								    <input type="hidden" th:name="apodHdurl" th:value="*{apodHdurl}" />
								    <input type="hidden" th:name="apodTitle" th:value="*{apodTitle}" />
								    <button type="submit" class="p-0" style="width: 100%;">
										<img type="submit" th:src="*{apodUrl}" class="img-fluid p-1" alt="Image" style="width: 100%;">
									</button>
								</form>
							</th:block>
							<!--/* 타입이 video일 경우 */-->
							<th:block th:if="${apodDTO.apodMedia_type == 'video'}">
								<a th:href="*{apodUrl}" class="videoButton btn btn-lg py-sm-4 mt-4 mb-5" target="_blank">여기를 누르면<br>영상으로 연결됩니다.</a>
							</th:block>
							<br>
							<h2 class="jua-font" th:text="*{apodTitle}" style="color: mediumslateblue;">제목</h2>
						</div>
						<ul class="service_list2 pt-3 px-0">
							<li>Date: <span th:text="*{apodDate}">날짜</span></li>
							<li><span th:text="*{apodExplanation}">내용</span></li>
							<br>
							<li th:unless="*{apodCopyright} == 'null'">Copyright(저작권): <span th:text="${apodDTO.apodCopyright}"></span></li>
							<br>							
							<li>
								<div class="form-floating mb-3" style="color: #aaa; font-size: 16px;">
								※ 나사에서 제공해 주는 정보로 한국과 시간 차이가 있습니다.</div>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</main>
	</div>

	<footer th:replace="~{tpl/tpl_fragments :: tpl_footer}" />
</body>

</html>
