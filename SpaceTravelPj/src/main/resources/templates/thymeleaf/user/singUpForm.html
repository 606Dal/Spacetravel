<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
	<head th:replace="~{tpl/tpl_fragments :: tpl_head( title='회원 가입 페이지' )}" />
	
	<body class="sticky">
		<nav th:replace="~{tpl/tpl_fragments :: tpl_nav ( 'singup' ) }" />
	
		<main class="mb-4 jua-font">
			<div class="container">
				<div class="row justify-content-center">
					<div id="contact_form" class="col-10 col-md-6 col-lg-4 col-xl-4">
						<h1 class="mt-5 jua-font">회원 가입</h1>
	
						<form id="signupForm" th:action="@{/user/singUpOk}" method="post">
							<div class="form-floating mb-3">
								<input type="text" id="username" name="username" class="form-control input_field pt-4 ps-2"
									th:value="${reUsername}" placeholder="Username" />
								<label for="username">아이디</label>
							</div>
							<h3>
								<div id="usernameError" class="badge text-bg-danger bg-opacity-75 jua-font" th:text="${msg}">아이디 중복 메시지</div>
							</h3>
							<div class="form-floating mb-3">
								<input type="password" id="password" name="password" class="form-control input_field pt-4 ps-2" placeholder="Password" />
								<label for="password">비밀번호</label>
							</div>
							<div class="form-floating mb-1">
								<input type="password" id="confirmPassword" name="confirmPassword" class="form-control input_field pt-4 ps-2" placeholder="samePassword" />
								<label for="confirmPassword">비밀번호 확인</label>
							</div>
							<div id="pwConfirm" class="ps-2">아이디와 비밀번호를 입력하세요</div><br>
							
					        <!-- CAPTCHA 영역 -->
							<div class="mb-3">
								<!-- 이미지 -->
							  	<div class="mb-2">
								    <img id="captchaImg" alt="CAPTCHA" class="captcha_img input_field">
								</div>
							
							  	<!-- 입력 + 새로고침 버튼 -->
							  	<div class="d-flex gap-2 align-items-stretch">
								  	<input type="text" name="captcha" autocomplete="off" required class="form-control captcha_input flex-grow-1" placeholder="내용 입력">
								  	<button type="button" id="captchaRefreshBtn" class="white_btn">새로고침</button>
								</div>
								<!-- 에러 메시지 -->
								<h3>
									<div id="captchaError" class="badge text-bg-danger bg-opacity-75 jua-font mt-2" style="display:none;"></div>									
								</h3>
							</div>
					        
							<div class="pt-4">
								<input type="submit" class="submit_btn mb-5" value="회원가입" />
							</div>
						</form>
					</div>
				</div>
			</div>
		</main>
	
		<footer th:replace="~{tpl/tpl_fragments :: tpl_footer}" />
		
	</body>
	<script>
		window.APP = {
	    	captchaUrl: /*[[@{/captcha}]]*/ "/captcha",
	    	loginUrl:   /*[[@{/user/loginPage}]]*/ "/user/loginPage"
		};
	</script>
	<script th:src="@{/js/pages/signup.js}"></script>

</html>
